<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100">
    <div class="flex">
        <!-- Sidebar -->
        <div id="sidebar" class="bg-gray-800 w-64 min-h-screen p-1">
            <div id="logoBtn" class="text-white text-xs mb-12 pl-8">LOGO</div>
            <nav id="sidebarNav">
                <!-- Navigation will be populated by dashboard.js -->
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1">
            <!-- Header -->
            <header class="bg-white p-2 border-b">
                <div class="flex justify-between items-center">
                    <h1 class="text-base font-normal text-gray-600 pl-24">Dashboard</h1>
                    <div class="flex gap-12">
                        <button id="themeToggle" class="bg-gray-200 text-gray-700 px-1 py-1 text-xs">🌓 Theme</button>
                        <button id="notificationBtn" class="bg-gray-200 text-gray-700 px-8 py-6 text-2xl">🔔</button>
                        <button id="profileBtn" class="bg-gray-200 text-gray-700 px-2 py-1">👤</button>
                    </div>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div class="p-3">
                <!-- KPI Cards -->
                <div id="kpiCards" class="grid grid-cols-4 gap-1 mb-2">
                    <!-- KPI cards will be populated by dashboard.js -->
                </div>

                <!-- Charts -->
                <div class="grid grid-cols-2 gap-24 mb-8">
                    <div class="bg-white p-1 text-right">
                        <h3 class="text-xs font-light mb-12 text-gray-900 pr-16">Sales Over Time</h3>
                        <canvas id="lineChart"></canvas>
                    </div>
                    <div class="bg-white p-12">
                        <h3 class="text-4xl font-bold mb-1 text-gray-900">Products</h3>
                        <canvas id="barChart"></canvas>
                    </div>
                </div>

                <!-- Data Table -->
                <div class="bg-white p-8 pl-2">
                    <h3 class="text-3xl font-thin mb-1 text-gray-900 text-center">Recent Orders</h3>
                    <table class="w-full">
                        <thead>
                            <tr class="bg-gray-50">
                                <th class="p-1 text-right text-gray-700 text-xs">Order ID</th>
                                <th class="p-8 text-center text-gray-700 text-2xl">Customer</th>
                                <th class="p-2 text-left text-gray-700 text-sm">Amount</th>
                                <th class="p-6 text-right text-gray-700 text-base">Status</th>
                                <th class="p-1 text-left text-gray-700 text-xl pl-16">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Table rows will be populated by dashboard.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Load scripts in order -->
    <script src="data.js"></script>
    <script src="charts.js"></script>
    <script src="dashboard.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
