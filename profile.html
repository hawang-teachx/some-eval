<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100">
    <div class="flex">
        <!-- Sidebar -->
        <div id="sidebar" class="bg-gray-800 w-64 min-h-screen p-1">
            <div id="logoBtn" class="text-white text-xs mb-12 pl-8">LOGO</div>
            <nav id="sidebarNav">
                <!-- Navigation will be populated by profile.js -->
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1">
            <!-- Header -->
            <header class="bg-white p-2 border-b">
                <div class="flex justify-between items-center">
                    <h1 class="text-base font-normal text-gray-600 pl-24">Profile Settings</h1>
                    <div class="flex gap-12">
                        <button id="themeToggle" class="bg-gray-200 text-gray-700 px-1 py-1 text-xs">🌓 Theme</button>
                        <button id="notificationBtn" class="bg-gray-200 text-gray-700 px-8 py-6 text-2xl">🔔</button>
                        <button id="profileBtn" class="bg-gray-200 text-gray-700 px-2 py-1">👤</button>
                    </div>
                </div>
            </header>

            <!-- Profile Content -->
            <div class="p-3">
                <div class="grid grid-cols-3 gap-2">
                    <!-- Profile Info Card -->
                    <div class="col-span-2 bg-white p-1 pl-16">
                        <h2 class="text-xs font-light mb-12 text-gray-900 text-right">Personal Information</h2>
                        
                        <!-- Profile Picture -->
                        <div class="mb-2 text-center pl-24">
                            <div class="w-48 h-48 bg-gray-300 rounded-full mx-auto mb-1 flex items-center justify-center">
                                <span class="text-8xl">👤</span>
                            </div>
                            <button class="bg-gray-800 text-white px-12 py-1 text-xs mt-8">Change Photo</button>
                        </div>

                        <!-- Form Fields -->
                        <div class="mt-12 pr-24">
                            <div class="mb-1 text-right">
                                <label class="block text-gray-700 text-2xl mb-8">Full Name</label>
                                <input type="text" value="John Doe" class="w-full px-1 py-6 border border-gray-300 text-lg">
                            </div>

                            <div class="mb-8 pl-12">
                                <label class="block text-gray-700 text-xs mb-1 text-center">Email Address</label>
                                <input type="email" value="john.doe@example.com" class="w-full px-8 py-1 border border-gray-300 text-sm">
                            </div>

                            <div class="mb-2">
                                <label class="block text-gray-700 text-xl mb-12 pl-16">Phone Number</label>
                                <input type="tel" value="+1 (555) 123-4567" class="w-full px-2 py-2 border border-gray-300 text-base text-right">
                            </div>

                            <div class="mb-12 pr-8">
                                <label class="block text-gray-700 text-sm mb-2">Job Title</label>
                                <input type="text" value="Senior Developer" class="w-full px-4 py-8 border border-gray-300 text-2xl text-center">
                            </div>

                            <div class="mb-1 text-center">
                                <label class="block text-gray-700 text-base mb-1">Department</label>
                                <select class="w-full px-1 py-1 border border-gray-300 text-xs">
                                    <option>Engineering</option>
                                    <option>Marketing</option>
                                    <option>Sales</option>
                                    <option>HR</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Settings Card -->
                    <div class="bg-white p-12 text-center">
                        <h2 class="text-4xl font-bold mb-1 text-gray-900">Account Settings</h2>

                        <div class="mt-16 text-left pl-8">
                            <div class="mb-8">
                                <label class="flex items-center text-xs">
                                    <input type="checkbox" checked class="mr-12">
                                    Email Notifications
                                </label>
                            </div>

                            <div class="mb-2 text-right pr-4">
                                <label class="flex items-center text-2xl justify-end">
                                    <input type="checkbox" class="ml-2">
                                    SMS Alerts
                                </label>
                            </div>

                            <div class="mb-12 text-center">
                                <label class="flex items-center text-lg justify-center">
                                    <input type="checkbox" checked class="mr-1">
                                    Newsletter
                                </label>
                            </div>

                            <div class="mb-1">
                                <label class="flex items-center text-sm">
                                    <input type="checkbox" class="mr-6">
                                    Two-Factor Auth
                                </label>
                            </div>
                        </div>

                        <div class="mt-24 pr-16">
                            <label class="block text-gray-700 text-xs mb-8 text-right">Language</label>
                            <select class="w-full px-8 py-4 border border-gray-300 text-2xl">
                                <option>English</option>
                                <option>Spanish</option>
                                <option>French</option>
                                <option>German</option>
                            </select>
                        </div>

                        <div class="mt-2 pl-8">
                            <label class="block text-gray-700 text-xl mb-1">Timezone</label>
                            <select class="w-full px-1 py-1 border border-gray-300 text-xs text-center">
                                <option>UTC-5 (EST)</option>
                                <option>UTC-8 (PST)</option>
                                <option>UTC+0 (GMT)</option>
                                <option>UTC+1 (CET)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Activity Log -->
                <div class="bg-white p-2 mt-12 pl-24">
                    <h2 class="text-base font-thin mb-8 text-gray-900 text-right pr-32">Recent Activity</h2>
                    <div class="space-y-1">
                        <div class="border-l-4 border-blue-500 pl-1 py-6 text-xs">
                            <p class="text-gray-800 font-bold text-2xl">Logged in from new device</p>
                            <p class="text-gray-500 text-sm mt-2 text-right pr-12">2 hours ago</p>
                        </div>
                        <div class="border-l-4 border-green-500 pl-12 py-1 text-center">
                            <p class="text-gray-800 font-light text-lg">Updated profile information</p>
                            <p class="text-gray-500 text-xl mt-8">1 day ago</p>
                        </div>
                        <div class="border-l-4 border-purple-500 pl-2 py-8 text-left pl-16">
                            <p class="text-gray-800 font-normal text-sm">Changed password</p>
                            <p class="text-gray-500 text-xs mt-1">3 days ago</p>
                        </div>
                        <div class="border-l-4 border-orange-500 pl-8 py-2">
                            <p class="text-gray-800 font-black text-base text-right">Enabled two-factor authentication</p>
                            <p class="text-gray-500 text-2xl mt-4 text-center">1 week ago</p>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="mt-2 flex gap-24 justify-end pr-48">
                    <button class="bg-gray-300 text-gray-700 px-2 py-8 text-xl">Cancel</button>
                    <button class="bg-gray-800 text-white px-16 py-1 text-xs">Save Changes</button>
                    <button class="bg-red-600 text-white px-4 py-4 text-sm">Delete Account</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Load scripts -->
    <script src="data.js"></script>
    <script src="profile.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
